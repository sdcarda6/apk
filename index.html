<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天室</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --md-sys-color-primary: #8C5239;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #FFDBC9;
            --md-sys-color-on-primary-container: #360E00;
            --md-sys-color-surface: #FFF5F0;
            --md-sys-color-on-surface: #261812;
            --md-sys-color-surface-variant: #F2DCD4;
            --md-sys-color-on-surface-variant: #52433D;
            --md-sys-color-outline: #85736C;
            --md-sys-color-surface-container: #FFE5DC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(38, 24, 18, 0.4);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .welcome-card {
            background: var(--md-sys-color-surface);
            width: 100%;
            max-width: 320px;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .welcome-card h2 {
            font-size: 1.15rem;
            color: var(--md-sys-color-on-surface);
            font-weight: 500;
        }
        .welcome-card input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: transparent;
            color: inherit;
        }
        .welcome-card input:focus { border-color: var(--md-sys-color-primary); border-width: 2px; }
        .welcome-card button {
            width: 100%;
            padding: 10px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
        }

        #image-viewer-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 12px;
        }
        #image-viewer-modal.active { display: flex; }
        #image-viewer-modal img {
            max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 12px;
        }
        .viewer-actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
        }
        .viewer-btn {
            padding: 8px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header {
            background-color: var(--md-sys-color-surface-container);
            padding: 8px 14px;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .header-right { display: flex; align-items: center; gap: 6px; }
        .status-pill {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 8px;
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
        }
        .status-pill.connected {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            font-weight: 600;
        }
        .setting-icon-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 2px; }

        .settings-card {
            background: var(--md-sys-color-surface-container);
            margin: 6px 8px 0 8px;
            padding: 10px 12px;
            border-radius: 16px;
            display: none;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            font-size: 0.8rem;
        }
        .settings-card.open { display: flex; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; }
        .setting-item input { width: 55px; padding: 2px 4px; border: 1px solid var(--md-sys-color-outline); border-radius: 6px; text-align: center; background: transparent; color: inherit; }

        .config-card {
            background: var(--md-sys-color-surface-container);
            margin: 6px 8px 0 8px;
            padding: 8px 12px;
            border-radius: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .config-card input {
            flex: 1; padding: 6px 10px; border: 1px solid var(--md-sys-color-outline);
            border-radius: 10px; font-size: 0.85rem; background: transparent; color: var(--md-sys-color-on-surface-variant); outline: none;
        }
        .config-card .lock-tip { font-size: 0.7rem; color: var(--md-sys-color-outline); white-space: nowrap; }

        #chat-box {
            flex: 1; overflow-y: auto; padding: 8px;
            display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
        }

        .message-row { display: flex; flex-direction: column; max-width: 85%; align-self: flex-start; }
        .message-row.mine { align-self: flex-end; }
        .sender-info { font-size: 0.65rem; color: var(--md-sys-color-outline); margin-bottom: 2px; margin-left: 4px; display: flex; gap: 4px; }
        .sender-info .uid { opacity: 0.7; font-family: monospace; }
        .message-row.mine .sender-info { display: none; }

        .bubble {
            padding: 8px 12px; border-radius: 16px; font-size: 0.88rem; line-height: 1.35; word-break: break-all;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03); overflow: hidden;
        }
        .message-row:not(.mine) .bubble { background-color: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface); border-bottom-left-radius: 4px; }
        .message-row.mine .bubble { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-bottom-right-radius: 4px; }

        .bubble img {
            display: block; max-width: 100%; max-height: 180px; border-radius: 10px; margin-top: 2px;
            object-fit: contain; background: #000; cursor: pointer;
        }
        .bubble video {
            display: block; max-width: 100%; max-height: 180px; border-radius: 10px; margin-top: 2px;
            object-fit: contain; background: #000;
        }
        .media-download-bar {
            margin-top: 4px;
            font-size: 0.7rem;
        }
        .media-download-bar a {
            color: inherit;
            text-decoration: underline;
            opacity: 0.85;
        }

        .file-card {
            display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.03);
            padding: 6px 10px; border-radius: 10px; text-decoration: none; color: inherit; margin-top: 2px;
        }
        .file-card .file-icon { font-size: 1.2rem; }
        .file-info { display: flex; flex-direction: column; font-size: 0.8rem; }
        .file-info .file-name { font-weight: 500; word-break: break-all; }
        .file-info .file-size { font-size: 0.65rem; color: var(--md-sys-color-outline); }

        .footer-bar {
            background-color: var(--md-sys-color-surface-container); padding: 8px; display: flex; gap: 6px; align-items: center;
            flex-shrink: 0; border-top: 1px solid rgba(0,0,0,0.05);
        }
        .footer-bar input[type="text"] {
            flex: 1; padding: 8px 12px; border: 1px solid var(--md-sys-color-outline);
            border-radius: 20px; background-color: var(--md-sys-color-surface); font-size: 0.9rem; outline: none; color: inherit;
        }
        .footer-bar input[type="text"]:focus { border-color: var(--md-sys-color-primary); border-width: 2px; }
        .file-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 2px; }
        .file-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .footer-bar button.send-btn {
            padding: 0 14px; height: 36px; background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary); border: none; border-radius: 18px; font-size: 0.85rem; font-weight: 500; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="image-viewer-modal" onclick="closeImageViewer(event)">
        <img id="modal-image" src="" alt="预览">
        <div class="viewer-actions">
            <a id="modal-download-btn" class="viewer-btn" href="" download="image.png" onclick="event.stopPropagation()">下载图片</a>
            <button class="viewer-btn" onclick="closeImageViewer(null)">关闭</button>
        </div>
    </div>

    <div id="welcome-overlay">
        <div class="welcome-card">
            <h2>设置名称</h2>
            <input type="text" id="overlay-nickname" value="同学" placeholder="请输入你的名字" onkeydown="if(event.key==='Enter') startConnect()">
            <button id="enter-btn" onclick="startConnect()">进入聊天室</button>
        </div>
    </div>

    <div class="header">
        <span>聊天大厅</span>
        <div class="header-right">
            <span id="status-pill" class="status-pill">未连接</span>
            <button class="setting-icon-btn" onclick="toggleSettings()" title="设置">⚙️</button>
        </div>
    </div>

    <div id="settings-card" class="settings-card">
        <div class="setting-item">
            <span>最多保存消息数：</span>
            <input type="number" id="max-msg-limit" value="50" min="10" max="200" onchange="cleanOldMessages()">
        </div>
        <div class="setting-item" style="color: var(--md-sys-color-outline); font-size: 0.75rem;">
            <span>我的编号：</span>
            <span id="my-short-id" style="font-family: monospace;">--</span>
        </div>
    </div>

    <div class="config-card">
        <input type="text" id="locked-nickname" disabled>
        <span class="lock-tip">🔒 名字已锁定</span>
    </div>

    <div id="chat-box"></div>

    <div class="footer-bar">
        <input type="file" id="file-selector" style="display: none;">
        <button class="file-btn" id="btn-trigger-file" title="发文件">📎</button>
        <input type="text" id="message-input" placeholder="发个消息聊聊..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">发送</button>
    </div>

<script>
    let client = null;
    const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
    const topic = 'my_public_chat_room_2026_string_trans_abc';
    const MAX_FILE_SIZE = 10 * 1024 * 1024;
    
    const myUniqueId = 'ID#' + Math.random().toString(36).substr(2, 4).toUpperCase();
    document.getElementById('my-short-id').textContent = myUniqueId;
    const myClientId = 'user_' + Math.random().toString(36).substr(2, 6);

    let currentNickname = '同学';

    function toggleSettings() {
        document.getElementById('settings-card').classList.toggle('open');
    }

    function cleanOldMessages() {
        const chatBox = document.getElementById('chat-box');
        const limit = parseInt(document.getElementById('max-msg-limit').value) || 50;
        while (chatBox.children.length > limit) {
            chatBox.removeChild(chatBox.firstChild);
        }
    }

    function openImageViewer(src, name) {
        const modal = document.getElementById('image-viewer-modal');
        const modalImg = document.getElementById('modal-image');
        const downloadBtn = document.getElementById('modal-download-btn');
        
        modalImg.src = src;
        downloadBtn.href = src;
        downloadBtn.download = name || 'image.png';
        modal.classList.add('active');
    }

    function closeImageViewer(e) {
        if (e && e.target.id === 'modal-image') return;
        document.getElementById('image-viewer-modal').classList.remove('active');
    }

    window.onload = function() {
        document.getElementById('overlay-nickname').focus();

        const fileSelector = document.getElementById('file-selector');
        const fileBtn = document.getElementById('btn-trigger-file');

        fileBtn.onclick = () => {
            if (!client || !client.connected) {
                alert('请先连接网络');
                return;
            }
            fileSelector.click();
        };

        fileSelector.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > MAX_FILE_SIZE) {
                alert('文件太大了，不能超过 10MB 噢');
                fileSelector.value = '';
                return;
            }

            fileBtn.disabled = true;
            fileBtn.textContent = '⏳';
            const statusPill = document.getElementById('status-pill');
            const originalStatusText = statusPill.textContent;
            statusPill.textContent = '正在发送...';

            const reader = new FileReader();
            
            reader.onload = (evt) => {
                const messageData = {
                    senderId: myClientId,
                    user: currentNickname,
                    uid: myUniqueId,
                    type: 'file',
                    fileType: file.type,
                    fileName: file.name,
                    fileSize: file.size,
                    data: evt.target.result
                };

                client.publish(topic, JSON.stringify(messageData), {}, (err) => {
                    fileBtn.disabled = false;
                    fileBtn.textContent = '📎';
                    statusPill.textContent = originalStatusText;
                    fileSelector.value = '';
                    if (err) {
                        alert('发送失败，请重试');
                    }
                });
            };

            reader.onerror = () => {
                fileBtn.disabled = false;
                fileBtn.textContent = '📎';
                statusPill.textContent = originalStatusText;
                fileSelector.value = '';
                alert('读取文件出错啦');
            };

            reader.readAsDataURL(file);
        };
    };

    function startConnect() {
        const nickInput = document.getElementById('overlay-nickname').value.trim();
        if (!nickInput) return alert('名字不能为空噢');
        currentNickname = nickInput;
        
        const btn = document.getElementById('enter-btn');
        btn.disabled = true;
        btn.textContent = '正在连接...';

        client = mqtt.connect(brokerUrl, { clientId: myClientId });

        client.on('connect', () => {
            document.getElementById('locked-nickname').value = currentNickname;
            document.getElementById('welcome-overlay').style.display = 'none';
            document.getElementById('status-pill').textContent = '已连接';
            document.getElementById('status-pill').classList.add('connected');
            client.subscribe(topic);
        });

        client.on('message', (top, payload) => {
            try {
                const data = JSON.parse(payload.toString());
                const isMine = (data.senderId === myClientId);
                appendMessage(data, isMine);
            } catch (e) {
                console.error(e);
            }
        });

        client.on('close', () => {
            document.getElementById('status-pill').textContent = '未连接';
            document.getElementById('status-pill').classList.remove('connected');
        });
    }

    function appendMessage(data, isMine) {
        const chatBox = document.getElementById('chat-box');
        const row = document.createElement('div');
        row.className = 'message-row' + (isMine ? ' mine' : '');
        
        let contentHtml = '';

        if (data.type === 'text') {
            contentHtml = escapeHtml(data.text);
        } else if (data.type === 'file') {
            const fType = data.fileType || '';
            const fName = data.fileName || '文件';
            const fSizeStr = (data.fileSize / 1024).toFixed(1) + ' KB';
            const fData = data.data;

            if (fType.startsWith('image/')) {
                contentHtml = `
                    <img src="${fData}" alt="${escapeHtml(fName)}" onclick="openImageViewer('${fData}', '${escapeHtml(fName)}')">
                    <div class="media-download-bar">
                        <a href="${fData}" download="${escapeHtml(fName)}">点击下载图片 (${fSizeStr})</a>
                    </div>
                `;
            } else if (fType.startsWith('video/')) {
                contentHtml = `
                    <video src="${fData}" controls playsinline></video>
                    <div class="media-download-bar">
                        <a href="${fData}" download="${escapeHtml(fName)}">点击下载视频 (${fSizeStr})</a>
                    </div>
                `;
            } else {
                contentHtml = `
                    <a class="file-card" href="${fData}" download="${escapeHtml(fName)}">
                        <span class="file-icon">📄</span>
                        <div class="file-info">
                            <span class="file-name">${escapeHtml(fName)}</span>
                            <span class="file-size">${fSizeStr} - 点击下载</span>
                        </div>
                    </a>
                `;
            }
        }
        
        row.innerHTML = `
            <div class="sender-info">
                <span class="name">${escapeHtml(data.user)}</span>
                <span class="uid">(${data.uid})</span>
            </div>
            <div class="bubble">${contentHtml}</div>
        `;
        chatBox.appendChild(row);
        cleanOldMessages();
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function sendMessage() {
        const msgInput = document.getElementById('message-input');
        const text = msgInput.value.trim();
        if (!text || !client || !client.connected) return;

        const messageData = {
            senderId: myClientId,
            user: currentNickname,
            uid: myUniqueId,
            type: 'text',
            text: text
        };

        client.publish(topic, JSON.stringify(messageData));
        msgInput.value = '';
    }
</script>
</body>
</html>
