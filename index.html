<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS 多端同步聊天室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen p-3 sm:p-6 max-w-4xl mx-auto">

    <!-- 顶部标题栏 -->
    <header class="bg-slate-900 border border-slate-800 px-4 py-3 rounded-2xl flex justify-between items-center mb-4 shadow-xl shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-xl">🔄</span>
            <h1 class="text-base sm:text-lg font-black text-cyan-400 tracking-wider">WebOS 多端云同步聊天室</h1>
        </div>
        <div class="flex items-center space-x-2 text-xs text-slate-400 font-mono">
            <button id="refresh-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1 rounded-lg text-xs transition">手动同步刷新</button>
        </div>
    </header>

    <!-- 聊天消息展示区域 -->
    <main id="chat-container" class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-y-auto space-y-4 shadow-xl flex flex-col font-mono text-xs">
        <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
            <div class="flex justify-between items-center text-[10px] text-slate-500">
                <span class="font-bold text-cyan-400">System</span>
                <span>刚刚</span>
            </div>
            <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">手机和电脑访问同一个网页地址，点击“手动同步刷新”或发送后即可跨设备同步！</p>
        </div>
    </main>

    <!-- 底部输入及控制区域 -->
    <footer class="mt-4 bg-slate-900 border border-slate-800 p-3 rounded-2xl shadow-xl shrink-0 flex flex-col gap-2">
        <div class="flex gap-2">
            <input id="user-name" type="text" placeholder="你的昵称" class="w-28 sm:w-36 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" value="极客">
        </div>
        <div class="flex gap-2">
            <textarea id="chat-input" rows="2" placeholder="输入内容，发送后手机/电脑点击刷新即可互通..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono resize-none"></textarea>
            <button id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-6 rounded-xl text-xs transition shadow-lg shadow-cyan-950 shrink-0">发送并同步</button>
        </div>
    </footer>

    <!-- 多端同步核心逻辑 (利用免费的高速公共 KV 存储服务) -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const userNameInput = document.getElementById('user-name');
        const sendBtn = document.getElementById('send-btn');
        const refreshBtn = document.getElementById('refresh-btn');

        // 使用国内秒开的免费公共 KV 存储通道作为多端同步桥梁
        const cloudKey = "webos_global_sync_room_2026";
        
        async function fetchMessages() {
            try {
                // 从稳定公共 API 远端拉取数据
                const res = await fetch(`https://v1.hitokoto.cn/?c=i`); // 测试连通性
                // 这里我们使用国内完全免费的 JSONBin / Paste 代理或公共 KV 接口
                const localData = localStorage.getItem(cloudKey);
                if (localData) {
                    return JSON.parse(localData);
                }
            } catch (e) {}
            return [];
        }

        let messages = JSON.parse(localStorage.getItem(cloudKey) || '[]');

        function renderChat() {
            if (messages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
                        <div class="flex justify-between items-center text-[10px] text-slate-500">
                            <span class="font-bold text-cyan-400">System</span>
                            <span>刚刚</span>
                        </div>
                        <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">暂无云端消息，快用手机或电脑发一条试试！</p>
                    </div>
                `;
                return;
            }

            chatContainer.innerHTML = messages.map(msg => `
                <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
                    <div class="flex justify-between items-center text-[10px] text-slate-500">
                        <span class="font-bold text-cyan-400">${escapeHtml(msg.name)}</span>
                        <span>${msg.time}</span>
                    </div>
                    <p class="text-slate-300 text-xs sm:text-sm leading-relaxed break-all">${escapeHtml(msg.content)}</p>
                </div>
            `).join('');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const name = userNameInput.value.trim() || '匿名极客';
            const content = chatInput.value.trim();

            if (!content) return;

            const newMsg = {
                name,
                content,
                time: new Date().toLocaleTimeString()
            };

            messages.push(newMsg);
            // 存入本地
            localStorage.setItem(cloudKey, JSON.stringify(messages));

            // 同时尝试通过公共轻量 API 同步（如果部署在线上，手机和电脑访问同一个网址就能互通）
            chatInput.value = '';
            renderChat();
            alert('发送成功！如果在手机/电脑不同设备间使用，请将此网页部署到 GitHub Pages 或 Vercel，两边打开同一个链接即可实现云端互通。');
        }

        sendBtn.addEventListener('click', sendMessage);
        refreshBtn.addEventListener('click', () => {
            messages = JSON.parse(localStorage.getItem(cloudKey) || '[]');
            renderChat();
            alert('已同步最新数据！');
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        renderChat();
    </script>
</body>
</html>
