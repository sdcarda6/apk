<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共大厅聊天室</title>
    <!-- 引入 Pico.css 让页面瞬间变得好看 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { max-width: 700px; margin: 0 auto; padding: 20px; }
        #chat-box { height: 400px; overflow-y: scroll; border: 1px solid var(--muted-border-color); padding: 15px; border-radius: var(--border-radius); background: var(--card-background-color); margin-bottom: 15px; }
        .message { margin-bottom: 10px; word-break: break-all; }
        .message .user { font-weight: bold; color: var(--primary); margin-right: 5px; }
        .message .time { font-size: 0.8rem; color: var(--muted-color); float: right; }
    </style>
    <!-- 引入 MQTT.js 用于实现国内稳定的 WebSocket 联机 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <h2>公共大厅聊天室</h2>
    
    <!-- 设置昵称栏 -->
    <div class="grid">
        <input type="text" id="nickname" placeholder="输入你的昵称..." value="访客_">
        <button id="connect-btn" onclick="toggleConnect()">连接聊天室</button>
    </div>

    <!-- 聊天消息展示框 -->
    <div id="chat-box">
        <div class="message"><span class="user">系统提示：</span>点击上方“连接聊天室”按钮开始畅聊！</div>
    </div>

    <!-- 发送消息栏 -->
    <fieldset role="group">
        <input type="text" id="message-input" placeholder="输入消息，按回车发送..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
        <input type="button" value="发送" id="send-btn" disabled onclick="sendMessage()">
    </fieldset>

<script>
    let client = null;
    // 使用全球免费、国内可连的公共 MQTT WebSocket 代理节点
    const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
    const topic = 'my_public_chat_room_2026_x_abc'; // 聊天室频道暗号

    function appendMessage(user, text, time) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<span class="time">${time}</span><span class="user">${user}:</span>${text}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight; // 自动滚动到底部
    }

    function toggleConnect() {
        const btn = document.getElementById('connect-btn');
        const nickInput = document.getElementById('nickname');
        const msgInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        if (client && client.connected) {
            client.end();
            return;
        }

        const nick = nickInput.value.trim() || '匿名用户';
        nickInput.disabled = true;
        btn.textContent = '连接中...';

        // 随机生成一个客户端ID
        const clientId = 'web_' + Math.random().toString(16).substr(2, 8);

        client = mqtt.connect(brokerUrl, { clientId: clientId });

        client.on('connect', function () {
            btn.textContent = '断开连接';
            btn.classList.add('secondary');
            msgInput.disabled = false;
            sendBtn.disabled = false;
            nickInput.disabled = true;
            appendMessage('系统', `成功加入公共大厅！`, new Date().toLocaleTimeString());
            
            // 订阅频道
            client.subscribe(topic);
        });

        client.on('message', function (top, payload) {
            try {
                const data = JSON.parse(payload.toString());
                appendMessage(data.user, data.text, data.time);
            } catch (e) {
                console.error(e);
            }
        });

        client.on('close', function () {
            btn.textContent = '连接聊天室';
            btn.classList.remove('secondary');
            msgInput.disabled = true;
            sendBtn.disabled = true;
            nickInput.disabled = false;
            appendMessage('系统', `已断开连接。`, new Date().toLocaleTimeString());
        });
    }

    function sendMessage() {
        const msgInput = document.getElementById('message-input');
        const nickInput = document.getElementById('nickname');
        const text = msgInput.value.trim();
        
        if (!text || !client || !client.connected) return;

        const messageData = {
            user: nickInput.value.trim(),
            text: text,
            time: new Date().toLocaleTimeString()
        };

        // 通过 MQTT 发送广播消息
        client.publish(topic, JSON.stringify(messageData));
        msgInput.value = '';
    }
</script>

</body>
</html>
