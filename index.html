<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：确保手机端完美自适应 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公共大厅聊天室</title>
    <!-- 引入 MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ededed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .header {
            background-color: #f7f7f7;
            border-bottom: 1px solid #dcdcdc;
            padding: 12px 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            color: #111;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ccc;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .header .status-dot.connected { background-color: #07c160; }

        /* 登录配置遮罩/条 */
        .config-bar {
            background: #fff;
            padding: 10px 16px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
        }
        .config-bar input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }
        .config-bar button {
            padding: 6px 14px;
            background-color: #07c160;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .config-bar button.connected { background-color: #fa5151; }

        /* 聊天消息滚动区域 */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* 系统提示样式 */
        .system-msg {
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            margin: 4px 0;
        }

        /* 消息行：模拟微信左右布局 */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .message-row.mine {
            flex-direction: row-reverse;
        }

        /* 头像 */
        .avatar {
            width: 38px;
            height: 38px;
            background-color: #10aeff;
            color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .message-row.mine .avatar {
            background-color: #07c160;
        }

        /* 消息内容体 */
        .content-wrap {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }
        .message-row.mine .content-wrap {
            align-items: flex-end;
        }

        .sender-name {
            font-size: 0.75rem;
            color: #7b7b7b;
            margin-bottom: 3px;
        }
        .message-row.mine .sender-name {
            display: none; /* 微信自己发的消息不显示昵称 */
        }

        /* 微信气泡样式 */
        .bubble {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
            position: relative;
            background-color: #ffffff;
            color: #000;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        /* 气泡小尾巴 */
        .bubble::before {
            content: "";
            position: absolute;
            top: 12px;
            border: 6px solid transparent;
        }
        /* 他人消息气泡（左侧） */
        .message-row:not(.mine) .bubble::before {
            right: 100%;
            border-right-color: #ffffff;
        }
        /* 自己消息气泡（右侧：使用高级微绿色调） */
        .message-row.mine .bubble {
            background-color: #95ec69;
            color: #000;
        }
        .message-row.mine .bubble::before {
            left: 100%;
            border-left-color: #95ec69;
        }

        /* 底部输入栏 */
        .footer-bar {
            background-color: #f7f7f7;
            border-top: 1px solid #dcdcdc;
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }
        .footer-bar input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background-color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .footer-bar input:focus {
            border-color: #07c160;
        }
        .footer-bar button {
            padding: 10px 16px;
            background-color: #07c160;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .footer-bar button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <div class="header">
        <div><span id="dot" class="status-dot"></span>公共大厅聊天室</div>
        <div id="online-tip" style="font-size: 0.8rem; color: #888;">未连接</div>
    </div>

    <!-- 昵称及连接控制 -->
    <div class="config-bar">
        <input type="text" id="nickname" placeholder="起个昵称..." value="微信网友_">
        <button id="connect-btn" onclick="toggleConnect()">连接</button>
    </div>

    <!-- 聊天内容框 -->
    <div id="chat-box">
        <div class="system-msg">-- 欢迎来到聊天室，请先输入昵称点击连接 --</div>
    </div>

    <!-- 底部输入框 -->
    <div class="footer-bar">
        <input type="text" id="message-input" placeholder="发送消息..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" disabled onclick="sendMessage()">发送</button>
    </div>

<script>
    let client = null;
    const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
    const topic = 'my_public_chat_room_2026_x_abc';
    
    // 生成一个固定的随机标识用来判断哪条消息是自己发的
    const myId = 'user_' + Math.random().toString(36).substr(2, 6);

    function appendMessage(user, text, isMine) {
        const chatBox = document.getElementById('chat-box');
        
        if (user === '系统') {
            const sysDiv = document.createElement('div');
            sysDiv.className = 'system-msg';
            sysDiv.textContent = text;
            chatBox.appendChild(sysDiv);
        } else {
            const row = document.createElement('div');
            row.className = 'message-row' + (isMine ? ' mine' : '');
            
            // 取昵称第一个字做头像
            const avatarText = user ? user.charAt(0).toUpperCase() : '用';
            
            row.innerHTML = `
                <div class="avatar">${avatarText}</div>
                <div class="content-wrap">
                    <div class="sender-name">${user}</div>
                    <div class="bubble">${escapeHtml(text)}</div>
                </div>
            `;
            chatBox.appendChild(row);
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 简单转义防止HTML注入
    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function toggleConnect() {
        const btn = document.getElementById('connect-btn');
        const nickInput = document.getElementById('nickname');
        const msgInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const dot = document.getElementById('dot');
        const onlineTip = document.getElementById('online-tip');

        if (client && client.connected) {
            client.end();
            return;
        }

        const nick = nickInput.value.trim() || '匿名';
        nickInput.disabled = true;
        btn.textContent = '连接中...';

        client = mqtt.connect(brokerUrl, { clientId: myId });

        client.on('connect', function () {
            btn.textContent = '断开';
            btn.classList.add('connected');
            msgInput.disabled = false;
            sendBtn.disabled = false;
            dot.classList.add('connected');
            onlineTip.textContent = '已连接';
            
            appendMessage('系统', `【${nick}】加入了聊天大厅`, false);
            client.subscribe(topic);
        });

        client.on('message', function (top, payload) {
            try {
                const data = JSON.parse(payload.toString());
                const isMine = (data.senderId === myId);
                appendMessage(data.user, data.text, isMine);
            } catch (e) {
                console.error(e);
            }
        });

        client.on('close', function () {
            btn.textContent = '连接';
            btn.classList.remove('connected');
            msgInput.disabled = true;
            sendBtn.disabled = true;
            nickInput.disabled = false;
            dot.classList.remove('connected');
            onlineTip.textContent = '未连接';
            appendMessage('系统', '已断开连接', false);
        });
    }

    function sendMessage() {
        const msgInput = document.getElementById('message-input');
        const nickInput = document.getElementById('nickname');
        const text = msgInput.value.trim();
        
        if (!text || !client || !client.connected) return;

        const messageData = {
            senderId: myId,
            user: nickInput.value.trim() || '匿名',
            text: text
        };

        client.publish(topic, JSON.stringify(messageData));
        msgInput.value = '';
    }
</script>

</body>
</html>
