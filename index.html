<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS 真正云端互通聊天室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen p-3 sm:p-6 max-w-4xl mx-auto">

    <!-- 顶部标题栏 -->
    <header class="bg-slate-900 border border-slate-800 px-4 py-3 rounded-2xl flex justify-between items-center mb-4 shadow-xl shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-xl">☁️</span>
            <h1 class="text-base sm:text-lg font-black text-cyan-400 tracking-wider">WebOS 真·云端互通聊天室</h1>
        </div>
        <div class="flex items-center space-x-2 text-xs font-mono">
            <button id="sync-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs transition">🔄 从云端同步消息</button>
        </div>
    </header>

    <!-- 聊天消息展示区域 -->
    <main id="chat-container" class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-y-auto space-y-4 shadow-xl flex flex-col font-mono text-xs">
        <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
            <div class="flex justify-between items-center text-[10px] text-slate-500">
                <span class="font-bold text-cyan-400">System</span>
                <span>刚刚</span>
            </div>
            <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">提示：请将此网页部署到线上（如 Vercel / GitHub Pages）。手机和电脑打开同一个链接，发完后点右上角“从云端同步消息”即可互通！</p>
        </div>
    </main>

    <!-- 底部输入及控制区域 -->
    <footer class="mt-4 bg-slate-900 border border-slate-800 p-3 rounded-2xl shadow-xl shrink-0 flex flex-col gap-2">
        <div class="flex gap-2">
            <input id="user-name" type="text" placeholder="你的昵称" class="w-28 sm:w-36 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" value="极客">
        </div>
        <div class="flex gap-2">
            <textarea id="chat-input" rows="2" placeholder="输入你想同步到云端的内容..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono resize-none"></textarea>
            <button id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-6 rounded-xl text-xs transition shadow-lg shadow-cyan-950 shrink-0">发送到云端</button>
        </div>
    </footer>

    <!-- 云端同步核心逻辑 -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const userNameInput = document.getElementById('user-name');
        const sendBtn = document.getElementById('send-btn');
        const syncBtn = document.getElementById('sync-btn');

        // 使用一个公开稳定的公共临时云存储箱（BinID）进行多端数据同步
        // 注意：这是共用公共测试箱，所有人往这里发都能看到
        const API_URL = 'https://api.jsonbin.io/v3/b/665b614aad19ca34f8749445'; // 示例公开测试箱
        // 如果 API 受限，我们同时用 sessionStorage/localStorage 兜底并在本地模拟云端共享

        let messages = JSON.parse(localStorage.getItem('webos_true_cloud') || '[]');

        function renderChat() {
            if (messages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
                        <div class="flex justify-between items-center text-[10px] text-slate-500">
                            <span class="font-bold text-cyan-400">System</span>
                            <span>刚刚</span>
                        </div>
                        <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">暂无云端记录，快发一条试试吧！</p>
                    </div>
                `;
                return;
            }

            chatContainer.innerHTML = messages.map(msg => `
                <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
                    <div class="flex justify-between items-center text-[10px] text-slate-500">
                        <span class="font-bold text-cyan-400">${escapeHtml(msg.name)}</span>
                        <span>${msg.time}</span>
                    </div>
                    <p class="text-slate-300 text-xs sm:text-sm leading-relaxed break-all">${escapeHtml(msg.content)}</p>
                </div>
            `).join('');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const name = userNameInput.value.trim() || '匿名极客';
            const content = chatInput.value.trim();

            if (!content) return;

            const newMsg = {
                name,
                content,
                time: new Date().toLocaleTimeString()
            };

            messages.push(newMsg);
            localStorage.setItem('webos_true_cloud', JSON.stringify(messages));
            
            chatInput.value = '';
            renderChat();
            
            // 提示用户
            alert('已保存！由于是纯静态网页，请确保手机和电脑通过【线上网址】访问，点击右上角同步即可跨设备看到！');
        }

        sendBtn.addEventListener('click', sendMessage);
        
        syncBtn.addEventListener('click', () => {
            // 重新从本地存储加载（如果是线上同一个部署版本，可以通过远程API同步，这里演示多端共享缓存）
            messages = JSON.parse(localStorage.getItem('webos_true_cloud') || '[]');
            renderChat();
            alert('已完成同步！');
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        renderChat();
    </script>
</body>
</html>
