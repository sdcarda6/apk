<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS P2P 点对点联机聊天室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen p-3 sm:p-6 max-w-4xl mx-auto">

    <!-- 顶部标题栏 -->
    <header class="bg-slate-900 border border-slate-800 px-4 py-3 rounded-2xl flex justify-between items-center mb-4 shadow-xl shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-xl">🔗</span>
            <h1 class="text-base sm:text-lg font-black text-cyan-400 tracking-wider">WebOS P2P 点对点直连聊天</h1>
        </div>
        <div class="flex items-center space-x-2 text-xs font-mono">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="status-text" class="text-slate-400">等待建立连接...</span>
        </div>
    </header>

    <!-- 连接控制面板 (用于生成和交换暗号) -->
    <div id="setup-panel" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-4 space-y-3 shrink-0 text-xs font-mono">
        <div class="text-cyan-300 font-bold">第一步：建立 P2P 连线（无需服务器，两人直连）</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="space-y-1">
                <button id="create-room-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded-xl transition">1. 我是房主 (生成暗号)</button>
                <textarea id="local-offer" rows="2" placeholder="点上方按钮生成你的暗号..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-slate-300 text-[10px] resize-none" readonly></textarea>
            </div>
            <div class="space-y-1">
                <button id="join-room-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl transition">2. 加入对方 (输入暗号并连接)</button>
                <textarea id="remote-offer" rows="2" placeholder="把对方的暗号粘过来，或者粘贴回应暗号..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-slate-300 text-[10px]"></textarea>
            </div>
        </div>
        <button id="connect-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl transition hidden">确认建立直连</button>
    </div>

    <!-- 聊天消息展示区域 -->
    <main id="chat-container" class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-y-auto space-y-4 shadow-xl flex flex-col font-mono text-xs">
        <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
            <div class="flex justify-between items-center text-[10px] text-slate-500">
                <span class="font-bold text-cyan-400">System</span>
                <span>刚刚</span>
            </div>
            <p class="text-slate-300 text-xs leading-relaxed">请按上方提示完成 P2P 连线。连线成功后即可开始私密聊天！</p>
        </div>
    </main>

    <!-- 底部输入及控制区域 -->
    <footer class="mt-4 bg-slate-900 border border-slate-800 p-3 rounded-2xl shadow-xl shrink-0 flex gap-2">
        <input id="user-name" type="text" placeholder="昵称" class="w-24 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" value="极客">
        <textarea id="chat-input" rows="1" placeholder="连线成功后输入内容，按 Enter 发送..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono resize-none" disabled></textarea>
        <button id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-5 rounded-xl text-xs transition shadow-lg shrink-0 opacity-50" disabled>发送</button>
    </footer>

    <!-- P2P 核心逻辑 -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const userNameInput = document.getElementById('user-name');
        const sendBtn = document.getElementById('send-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const connectBtn = document.getElementById('connect-btn');
        const localOffer = document.getElementById('local-offer');
        const remoteOffer = document.getElementById('remote-offer');
        const setupPanel = document.getElementById('setup-panel');

        let pc;
        let dataChannel;

        // 配置免费的 STUN 服务器（仅用于协助穿透局域网，不经过任何第三方服务器传聊天内容）
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        function initConnection() {
            pc = new RTCPeerConnection(rtcConfig);

            pc.onicecandidate = (event) => {
                if (event.candidate === null) {
                    localOffer.value = JSON.stringify(pc.localDescription);
                }
            };
        }

        // 房主模式：生成 Offer
        createRoomBtn.addEventListener('click', async () => {
            initConnection();
            dataChannel = pc.createDataChannel('chat');
            setupDataChannel();

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            createRoomBtn.innerText = "1. 暗号已生成 (复制发给好友)";
            localOffer.select();
        });

        // 加入者模式：输入房主的 Offer，生成 Answer
        joinRoomBtn.addEventListener('click', async () => {
            if (!remoteOffer.value.trim()) {
                alert('请先粘贴房主的暗号！');
                return;
            }

            initConnection();

            pc.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannel();
            };

            const offer = JSON.parse(remoteOffer.value);
            await pc.setRemoteDescription(offer);

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            connectBtn.classList.remove('hidden');
            joinRoomBtn.innerText = "2. 回应暗号已生成 (复制发回给房主)";
            localOffer.select();
        });

        // 如果你是房主，收到对方的回应暗号后点确认
        connectBtn.addEventListener('click', async () => {
            if (!remoteOffer.value.trim()) return;
            const answer = JSON.parse(remoteOffer.value);
            await pc.setRemoteDescription(answer);
            connectBtn.innerText = "正在建立底层直连...";
        });

        function setupDataChannel() {
            dataChannel.onopen = () => {
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                statusText.innerText = "P2P 直连成功 (已加密)";
                chatInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
                addSystemMessage("P2P 通道已打通，开始聊天吧！");
                // 隐藏繁琐的设置面板
                setupPanel.style.display = 'none';
            };

            dataChannel.onclose = () => {
                statusDot.className = "w-2 h-2 rounded-full bg-rose-500";
                statusText.innerText = "连接已断开";
            };

            dataChannel.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                appendMessage(msg.name, msg.content, msg.time);
            };
        }

        function sendMessage() {
            const name = userNameInput.value.trim() || '极客';
            const content = chatInput.value.trim();
            if (!content || !dataChannel || dataChannel.readyState !== 'open') return;

            const time = new Date().toLocaleTimeString();
            const msgObj = { name, content, time };

            dataChannel.send(JSON.stringify(msgObj));
            appendMessage(name + ' (我)', content, time);
            chatInput.value = '';
        }

        function appendMessage(name, content, time) {
            chatContainer.innerHTML += `
                <div class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-1">
                    <div class="flex justify-between items-center text-[10px] text-slate-500">
                        <span class="font-bold text-cyan-400">${escapeHtml(name)}</span>
                        <span>${time}</span>
                    </div>
                    <p class="text-slate-300 text-xs sm:text-sm leading-relaxed break-all">${escapeHtml(content)}</p>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            appendMessage('System', text, new Date().toLocaleTimeString());
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
